<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Works — weisehexe</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

<style>

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

:root{
  --bg:#0d0b12;
  --text:#eee9ed;
  --muted:#a9a1ad;
  --line:#ffffff22;
  --accent:#d9c7dc;
  --serif:"Cormorant Garamond",Georgia,serif;
  --sans:"Montserrat",Arial,sans-serif
}

body{
  margin:0;
  background:
    radial-gradient(circle at 15% 10%,#80618d2b,transparent 28rem),
    radial-gradient(circle at 85% 40%,#5d78902b,transparent 30rem),
    var(--bg);
  color:var(--text);
  font:300 16px/1.7 var(--sans)
}

a{
  color:inherit;
  text-decoration:none
}

/* HEADER */

.site-header{
  height:92px;
  padding:0 6vw;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  backdrop-filter:blur(12px)
}

.logo{
  font:400 2rem var(--serif)
}

nav{
  display:flex;
  gap:28px;
  text-transform:uppercase;
  letter-spacing:.15em;
  font-size:.65rem;
  color:var(--muted)
}

nav a:hover,
nav .active{
  color:var(--text)
}

/* TEXT */

.eyebrow{
  text-transform:uppercase;
  letter-spacing:.24em;
  font-size:.63rem;
  color:var(--muted);
  margin:0 0 18px
}

h1,
h2{
  font:300 clamp(3rem,8vw,7rem)/.95 var(--serif);
  margin:0
}

em{
  color:var(--accent)
}

/* PORTFOLIO */

.portfolio{
  padding:100px 7vw 140px;
  max-width:1600px;
  margin:auto;
  text-align:center
}

.portfolio-intro{
  margin-bottom:65px
}

.portfolio-intro p:last-child{
  color:var(--muted)
}



/* GALLERY */

.all-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:28px;
  text-align:left
}

.card{
  overflow:hidden
}

.art{
  width:100%;
  aspect-ratio:4/5;
  display:block;
  object-fit:cover;
  background:
    radial-gradient(circle at 50% 35%,#bca7c444,transparent 25%),
    linear-gradient(145deg,#2b2133,#121018);
  transition:.7s
}

.card:hover .art{
  transform:scale(1.025)
}

/* FOOTER */

footer{
  border-top:1px solid var(--line);
  padding:28px 6vw;
  display:flex;
  justify-content:space-between;
  color:#77727c;
  text-transform:uppercase;
  letter-spacing:.1em;
  font-size:.58rem
}

/* TABLET */

@media(max-width:900px){

  .all-grid{
    grid-template-columns:repeat(2,1fr)
  }

}

/* MOBILE */

@media(max-width:600px){

  .site-header{
    height:auto;
    padding:20px 5vw;
    align-items:flex-start
  }

  .site-header nav{
    gap:12px;
    justify-content:flex-end
  }

  .all-grid{
    grid-template-columns:1fr
  }

  .portfolio{
    padding:80px 6vw 110px
  }

  footer{
    display:block
  }

  footer span{
    display:block;
    margin:7px 0
  }

}

</style>
</head>

<body>

<header class="site-header">

  <a class="logo" href="index.html">
    weisehexe
  </a>

  <nav>
    <a href="index.html">home</a>
    <a class="active" href="portfolio.html">works</a>
    <a href="index.html#about">about</a>
    <a href="index.html#contact">contact</a>
  </nav>

</header>


<main class="portfolio">

  <div class="portfolio-intro">

    <p class="eyebrow">
      портфолио
    </p>

    <h1>
      Все <em>арты</em>
    </h1>

  </div>


  <!-- FILTERS -->


  <!-- GALLERY -->

  <div id="all" class="all-grid"></div>

</main>


<footer>

  <span>
    © <span id="year"></span> weisehexe
  </span>

  <span>
    made with moonlight ✦
  </span>

</footer>


<script>

/* =========================

document.addEventListener("DOMContentLoaded",()=>{

  const y=document.getElementById("year");

  if(y){
    y.textContent=new Date().getFullYear();
  }


  /* Image shown if the original
     file cannot be found */

  const fallback=`data:image/svg+xml;charset=UTF-8,${encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000"><rect width="800" height="1000" fill="#211a29"/><circle cx="400" cy="390" r="160" fill="#cbbbd0" opacity=".28"/><text x="400" y="800" text-anchor="middle" fill="#eee9ed" font-family="Georgia" font-size="38">Your artwork</text></svg>'
  )}`;


  /* =========================
     IMAGE ONLY CARD
     ========================= */

  function card(w){

    return `
      <article class="card">

        <img
          class="art"
          src="${w.image}"
          alt="${w.title}"
          loading="lazy"
          onerror="this.src='${fallback}'"
        >

      </article>
    `;

  }


  /* =========================
     FILTERS
     ========================= */

/* =========================
   SHOW ALL WORKS
   ========================= */

const all=document.getElementById("all");

if(all){

  all.innerHTML=works.map(card).join("");

}

});

</script>

</body>
</html>
